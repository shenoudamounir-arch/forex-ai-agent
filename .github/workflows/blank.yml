name: EURUSD Forex Signal

on:
  workflow_dispatch:

jobs:
  forex-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze EURUSD and send signal
        env:
          API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          RESPONSE=$(curl -s "https://api.twelvedata.com/time_series?symbol=EUR/USD&interval=5min&outputsize=30&apikey=${API_KEY}")

          MESSAGE=$(echo "$RESPONSE" | python3 -c "
          import sys, json

          d = json.load(sys.stdin)

          if 'values' not in d:
              print('❌ Data Error: ' + str(d.get('message', d)))
              sys.exit()

          candles = d['values']

          closes = [float(x['close']) for x in candles]
          highs = [float(x['high']) for x in candles]
          lows = [float(x['low']) for x in candles]

          current = closes[0]

          ma5 = sum(closes[:5]) / 5
          ma20 = sum(closes[:20]) / 20

          resistance = max(highs[1:21])
          support = min(lows[1:21])

          signal = 'WAIT'
          reason = 'No strong confirmation yet'
          emoji = '⚪'

          if current > ma5 and ma5 > ma20:
              signal = 'BUY'
              emoji = '🟢'
              reason = 'Short-term trend is bullish'

          elif current < ma5 and ma5 < ma20:
              signal = 'SELL'
              emoji = '🔴'
              reason = 'Short-term trend is bearish'

          if signal == 'BUY':
              entry = current
              sl = support
              risk = entry - sl
              tp = entry + (risk * 2)

          elif signal == 'SELL':
              entry = current
              sl = resistance
              risk = sl - entry
              tp = entry - (risk * 2)

          else:
              entry = current
              sl = None
              tp = None

          message = (
              '🤖 FOREX AI SIGNAL\n\n'
              '💱 EUR/USD\n'
              '⏱ Timeframe: 5 Minutes\n\n'
              + emoji + ' SIGNAL: ' + signal + '\n\n'
              + 'Current Price: ' + format(current, '.5f') + '\n'
          )

          if sl is not None:
              message += (
                  'Entry: ' + format(entry, '.5f') + '\n'
                  'Stop Loss: ' + format(sl, '.5f') + '\n'
                  'Take Profit: ' + format(tp, '.5f') + '\n'
                  'Risk/Reward: 1:2\n'
              )

          message += (
              '\n📊 MA5: ' + format(ma5, '.5f') +
              '\n📊 MA20: ' + format(ma20, '.5f') +
              '\n\n📝 Reason: ' + reason +
              '\n\n⚠️ Analysis only — no automatic trade.'
          )

          print(message)
          ")

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
