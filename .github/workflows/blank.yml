name: Test EURUSD 5M

on:
  workflow_dispatch:

jobs:
  forex-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get EURUSD and send to Telegram
        env:
          API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESPONSE=$(curl -s "https://api.twelvedata.com/time_series?symbol=EUR/USD&interval=5min&outputsize=2&apikey=${API_KEY}")

          MESSAGE=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          d=json.load(sys.stdin)

          if 'values' not in d:
              print('❌ Twelve Data Error: ' + str(d.get('message', d)))
          else:
              c=d['values'][0]
              print(
                  '🤖 FOREX AI TEST\n\n'
                  '💱 EUR/USD\n'
                  '⏱ Timeframe: 5 Minutes\n\n'
                  '🕐 Candle: ' + c['datetime'] + '\n'
                  'Open: ' + c['open'] + '\n'
                  'High: ' + c['high'] + '\n'
                  'Low: ' + c['low'] + '\n'
                  'Close: ' + c['close'] + '\n\n'
                  '✅ Market data connection successful'
              )
          ")

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
