name: Get Telegram Chat ID

on:
  workflow_dispatch:

jobs:
  get-chat-id:
    runs-on: ubuntu-latest

    steps:
      - name: Get Chat ID
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          RESPONSE=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates")
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('CHAT_ID:', d['result'][-1]['message']['chat']['id'] if d.get('result') else 'NO_MESSAGES_FOUND')"
