name: Forex AI - EURUSD & GBPUSD

on:
  workflow_dispatch:
  schedule:
   - cron: '2-59/5 * * * 1-5'

permissions:
  contents: write

jobs:
  forex-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze Forex Pairs
        env:
          API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}

        run: |
          cat > /tmp/forex.py <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          API_KEY = os.environ["API_KEY"]
          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]
          EVENT_NAME = os.environ.get("EVENT_NAME", "")

          PAIRS = ["EUR/USD", "GBP/USD"]
          STATE_FILE = "signal_state.json"

          # Load previous signal state
          try:
              with open(STATE_FILE, "r") as f:
                  state = json.load(f)
          except Exception:
              state = {}

          def ema(values, period):
              k = 2 / (period + 1)
              e = values[0]
              result = []

              for v in values:
                  e = (v * k) + (e * (1 - k))
                  result.append(e)

              return result

          def rsi(values, period=14):
              changes = [
                  values[x] - values[x - 1]
                  for x in range(1, len(values))
              ]

              gains = [max(x, 0) for x in changes[-period:]]
              losses = [max(-x, 0) for x in changes[-period:]]

              avg_gain = sum(gains) / period
              avg_loss = sum(losses) / period

              if avg_loss == 0:
                  return 100.0

              rs = avg_gain / avg_loss
              return 100 - (100 / (1 + rs))

          def atr(highs, lows, closes, period=14):
              tr = []

              for x in range(1, len(closes)):
                  tr.append(
                      max(
                          highs[x] - lows[x],
                          abs(highs[x] - closes[x - 1]),
                          abs(lows[x] - closes[x - 1])
                      )
                  )

              return sum(tr[-period:]) / period

          def get_candles(symbol):
              params = urllib.parse.urlencode({
                  "symbol": symbol,
                  "interval": "5min",
                  "outputsize": 80,
                  "apikey": API_KEY
              })

              url = "https://api.twelvedata.com/time_series?" + params

              with urllib.request.urlopen(url, timeout=30) as response:
                  return json.loads(response.read().decode())

          def send_telegram(message):
              url = (
                  "https://api.telegram.org/bot"
                  + BOT_TOKEN
                  + "/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "text": message
              }).encode()

              urllib.request.urlopen(
                  url,
                  data=data,
                  timeout=30
              ).read()

          def analyze(symbol):
              data = get_candles(symbol)

              if "values" not in data:
                  raise Exception(
                      str(data.get("message", data))
                  )

              candles = list(reversed(data["values"]))

              opens = [float(x["open"]) for x in candles]
              highs = [float(x["high"]) for x in candles]
              lows = [float(x["low"]) for x in candles]
              closes = [float(x["close"]) for x in candles]

              # Previous candle = confirmed closed candle
              i = -2

              price = closes[i]
              candle_open = opens[i]

              confirmed_closes = closes[:i + 1]
              confirmed_highs = highs[:i + 1]
              confirmed_lows = lows[:i + 1]

              ema9 = ema(closes, 9)[i]
              ema21 = ema(closes, 21)[i]

              rsi14 = rsi(confirmed_closes)

              atr14 = atr(
                  confirmed_highs,
                  confirmed_lows,
                  confirmed_closes
              )

              bullish = price > candle_open
              bearish = price < candle_open

              buy_score = 0
              sell_score = 0
              reasons = []

              if ema9 > ema21:
                  buy_score += 1
                  reasons.append("EMA bullish")

              elif ema9 < ema21:
                  sell_score += 1
                  reasons.append("EMA bearish")

              if price > ema9:
                  buy_score += 1

              elif price < ema9:
                  sell_score += 1

              if 50 < rsi14 < 70:
                  buy_score += 1
                  reasons.append("RSI bullish")

              elif 30 < rsi14 < 50:
                  sell_score += 1
                  reasons.append("RSI bearish")

              if bullish:
                  buy_score += 1
                  reasons.append("Bullish candle")

              elif bearish:
                  sell_score += 1
                  reasons.append("Bearish candle")

              signal = "WAIT"
              emoji = "⚪"

              entry = None
              stop_loss = None
              take_profit = None

              if (
                  buy_score >= 3
                  and buy_score > sell_score
                  and rsi14 < 70
              ):
                  signal = "BUY"
                  emoji = "🟢"

                  entry = price
                  stop_loss = entry - (atr14 * 1.5)

                  risk = entry - stop_loss
                  take_profit = entry + (risk * 2)

              elif (
                  sell_score >= 3
                  and sell_score > buy_score
                  and rsi14 > 30
              ):
                  signal = "SELL"
                  emoji = "🔴"

                  entry = price
                  stop_loss = entry + (atr14 * 1.5)

                  risk = stop_loss - entry
                  take_profit = entry - (risk * 2)

              message = (
                  "🤖 FOREX AI ANALYSIS\n\n"
                  f"💱 {symbol}\n"
                  "⏱ Timeframe: 5 Minutes\n\n"
                  f"{emoji} SIGNAL: {signal}\n\n"
                  f"💵 Price: {price:.5f}\n"
                  f"📈 EMA9: {ema9:.5f}\n"
                  f"📉 EMA21: {ema21:.5f}\n"
                  f"📊 RSI14: {rsi14:.1f}\n"
                  f"📏 ATR14: {atr14:.5f}\n"
              )

              if signal != "WAIT":
                  message += (
                      f"\n🎯 Entry: {entry:.5f}\n"
                      f"🛑 Stop Loss: {stop_loss:.5f}\n"
                      f"💰 Take Profit: {take_profit:.5f}\n"
                      "⚖️ Risk/Reward: 1:2\n"
                  )

              message += (
                  "\n🔎 Confirmation: "
                  + ", ".join(reasons)
                  + f"\n\n🟢 Buy score: {buy_score}/4"
                  + f"\n🔴 Sell score: {sell_score}/4"
                  + "\n\n⚠️ Analysis only — no automatic trade."
              )

              return signal, message

          for pair in PAIRS:
              try:
                  signal, message = analyze(pair)

                  previous_signal = state.get(pair)

                  # Manual run = always show result for testing
                  if EVENT_NAME == "workflow_dispatch":
                      send_telegram(message)

                  # Automatic run:
                  # Send only a NEW BUY or SELL
                  elif signal in ("BUY", "SELL"):
                      if signal != previous_signal:
                          send_telegram(message)

                  # Save current state even if WAIT
                  state[pair] = signal

              except Exception as error:
                  send_telegram(
                      "❌ FOREX AI ERROR\n\n"
                      + pair
                      + "\n"
                      + str(error)
                  )

          with open(STATE_FILE, "w") as f:
              json.dump(state, f, indent=2)
          PY

          python3 /tmp/forex.py

      - name: Save Signal State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add signal_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update forex signal state [skip ci]"
            git push
          fi
