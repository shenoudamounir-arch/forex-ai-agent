name: Advanced EURUSD Forex Signal

on:
  workflow_dispatch:

jobs:
  forex-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze EURUSD
        env:
          API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          RESPONSE=$(curl -s "https://api.twelvedata.com/time_series?symbol=EUR/USD&interval=5min&outputsize=80&apikey=${API_KEY}")

          MESSAGE=$(echo "$RESPONSE" | python3 -c "
          import sys, json

          d=json.load(sys.stdin)

          if 'values' not in d:
              print('❌ Data Error: ' + str(d.get('message', d)))
              sys.exit()

          candles=list(reversed(d['values']))

          opens=[float(x['open']) for x in candles]
          highs=[float(x['high']) for x in candles]
          lows=[float(x['low']) for x in candles]
          closes=[float(x['close']) for x in candles]

          # Previous candle = confirmed closed candle
          i=-2
          price=closes[i]
          candle_open=opens[i]

          def ema(values, period):
              k=2/(period+1)
              e=values[0]
              result=[]

              for v in values:
                  e=(v*k)+(e*(1-k))
                  result.append(e)

              return result

          def calculate_rsi(values, period=14):
              changes=[
                  values[x]-values[x-1]
                  for x in range(1,len(values))
              ]

              gains=[max(x,0) for x in changes[-period:]]
              losses=[max(-x,0) for x in changes[-period:]]

              avg_gain=sum(gains)/period
              avg_loss=sum(losses)/period

              if avg_loss == 0:
                  return 100.0

              rs=avg_gain/avg_loss
              return 100-(100/(1+rs))

          def calculate_atr(highs,lows,closes,period=14):
              tr=[]

              for x in range(1,len(closes)):
                  tr.append(
                      max(
                          highs[x]-lows[x],
                          abs(highs[x]-closes[x-1]),
                          abs(lows[x]-closes[x-1])
                      )
                  )

              return sum(tr[-period:])/period

          confirmed_closes=closes[:i+1]
          confirmed_highs=highs[:i+1]
          confirmed_lows=lows[:i+1]

          ema9=ema(closes,9)[i]
          ema21=ema(closes,21)[i]

          rsi14=calculate_rsi(confirmed_closes)
          atr14=calculate_atr(
              confirmed_highs,
              confirmed_lows,
              confirmed_closes
          )

          bullish=price > candle_open
          bearish=price < candle_open

          buy_score=0
          sell_score=0
          reasons=[]

          if ema9 > ema21:
              buy_score+=1
              reasons.append('EMA bullish')
          elif ema9 < ema21:
              sell_score+=1
              reasons.append('EMA bearish')

          if price > ema9:
              buy_score+=1
          elif price < ema9:
              sell_score+=1

          if 50 < rsi14 < 70:
              buy_score+=1
              reasons.append('RSI bullish')

          elif 30 < rsi14 < 50:
              sell_score+=1
              reasons.append('RSI bearish')

          if bullish:
              buy_score+=1
              reasons.append('Bullish candle')

          elif bearish:
              sell_score+=1
              reasons.append('Bearish candle')

          signal='WAIT'
          emoji='⚪'
          entry=None
          sl=None
          tp=None

          # Require at least 3 confirmations
          if buy_score >= 3 and buy_score > sell_score:

              signal='BUY'
              emoji='🟢'

              entry=price

              # Stop 1.5 ATR below entry
              sl=entry-(atr14*1.5)

              risk=entry-sl

              # Target = twice the risk
              tp=entry+(risk*2)

          elif sell_score >= 3 and sell_score > buy_score:

              signal='SELL'
              emoji='🔴'

              entry=price

              # Stop 1.5 ATR above entry
              sl=entry+(atr14*1.5)

              risk=sl-entry

              # Target = twice the risk
              tp=entry-(risk*2)

          message=(
              '🤖 FOREX AI ANALYSIS\n\n'
              '💱 EUR/USD\n'
              '⏱ Timeframe: 5 Minutes\n\n'
              + emoji + ' SIGNAL: ' + signal + '\n\n'
              '💵 Price: ' + format(price,'.5f') + '\n'
              '📈 EMA9: ' + format(ema9,'.5f') + '\n'
              '📉 EMA21: ' + format(ema21,'.5f') + '\n'
              '📊 RSI14: ' + format(rsi14,'.1f') + '\n'
              '📏 ATR14: ' + format(atr14,'.5f') + '\n'
          )

          if signal != 'WAIT':

              message+=(
                  '\n🎯 Entry: ' + format(entry,'.5f') +
                  '\n🛑 Stop Loss: ' + format(sl,'.5f') +
                  '\n💰 Take Profit: ' + format(tp,'.5f') +
                  '\n⚖️ Risk/Reward: 1:2\n'
              )

          message+=(
              '\n🔎 ' + ', '.join(reasons) +
              '\n\n🟢 Buy score: ' + str(buy_score) + '/4'
              '\n🔴 Sell score: ' + str(sell_score) + '/4'
              '\n\n⚠️ Analysis only — no automatic trade.'
          )

          print(message)
          ")

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
